<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Sorteo - Pollo Premium</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f7f9fa; color: #333; padding: 20px; }
        
        .contenedor-admin { width: 100%; max-width: 1050px; margin: 0 auto; background: #ffffff; border-radius: 15px; box-shadow: 0px 4px 15px rgba(0,0,0,0.05); border: 1px solid #e1e8ed; overflow: hidden; }
        .header-admin { background: linear-gradient(135deg, #d32f2f, #b71c1c); color: white; padding: 25px; text-align: center; position: relative; }
        .header-admin h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .header-admin p { font-size: 0.9rem; opacity: 0.9; }

        .panel-acciones { padding: 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; }
        .buscador { padding: 10px 15px; border: 1.5px solid #cbd5e1; border-radius: 8px; width: 100%; max-width: 300px; font-size: 0.95rem; }
        .buscador:focus { outline: none; border-color: #ff9800; }
        
        .estadistica { font-weight: 600; color: #4a5568; font-size: 1rem; background: #edf2f7; padding: 8px 15px; border-radius: 20px; }
        
        .btn-sorteo { background: #ff9800; color: white; border: none; padding: 12px 25px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-sorteo:hover { background: #e65100; }

        /* Tabla Responsiva */
        .tabla-contenedor { width: 100%; overflow-x: auto; padding: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
        th { background-color: #4a5568; color: white; padding: 12px; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; }
        tr:hover { background-color: #f1f5f9; }
        
        .badge-qr { background: #e2e8f0; color: #4a5568; padding: 3px 8px; border-radius: 5px; font-family: monospace; font-size: 0.85rem; }
        .badge-estado { background: #fff8e1; color: #b78103; padding: 3px 8px; border-radius: 5px; font-weight: bold; font-size: 0.85rem; }

        /* Modal del Ganador */
        .modal-ganador { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-contenido { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 500px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 4px solid #ff9800; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-contenido h2 { color: #d32f2f; font-size: 2rem; margin-bottom: 15px; text-transform: uppercase; }
        .nombre-ganador { font-size: 2.2rem; font-weight: 800; color: #1a202c; margin: 20px 0; background: #fff8e1; padding: 15px; border-radius: 10px; border: 2px dashed #ff9800; word-break: break-word; }
        .datos-ganador { font-size: 1.1rem; color: #4a5568; line-height: 1.8; margin-bottom: 25px; text-align: left; background: #f7f9fa; padding: 15px; border-radius: 8px; }
        .btn-cerrar { background: #d32f2f; color: white; border: none; padding: 10px 25px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; }

        .cargando { text-align: center; padding: 40px; color: #64748b; font-weight: 600; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="contenedor-admin">
        <div class="header-admin">
            <p>Industrias Pollo Premium 5.8, C.A. 🍗 </p>
        </div>

        <div class="panel-acciones">
            <input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar por nombre o cédula...">
            <div id="contador" class="estadistica">Participantes: Cargando...</div>
            <button id="btn-sorteo" class="btn-sorteo">🎉 ¡ELEGIR GANADOR AL AZAR!</button>
        </div>

        <div class="tabla-contenedor">
            <div id="cargando-texto" class="cargando">Conectando con Supabase y obteniendo lista...</div>
            <table id="tabla-participantes" style="display: none;">
                <thead>
                    <tr>
                        <th>Nombre / Razón Social</th>
                        <th>Cédula / RIF</th>
                        <th>Teléfono</th>
                        <th>Ciudad</th>
                        <th>Correo Electrónico</th>
                        <th>Código QR Usado</th>
                        <th>Estado Sorteo</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal-ganador" class="modal-ganador">
        <div class="modal-contenido">
            <h2>¡Tenemos un Ganador! 🏆</h2>
            <div id="animacion-nombre" class="nombre-ganador">Seleccionando...</div>
            <div id="datos-ganador" class="datos-ganador" style="display: none;">
            </div>
            <button id="btn-cerrar-modal" class="btn-cerrar" style="display: none;">Cerrar y Continuar</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lkqixjlbbibnlufgldaw.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrcWl4amxiYmlibmx1ZmdsZGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIzOTYsImV4cCI6MjA5NTYzODM5Nn0.mhZ1gGWozhSETPINmS0cyUCrDV4LcmUMPzDTDWq6bcI"; 
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let listaParticipantes = []; 

        // Cargar los participantes apenas abra la página
        async function cargarParticipantes() {
            try {
                // Se cambió 'created_at' por la columna real de tu tabla: 'fecha_registro'
                const { data, error } = await _supabase
                    .from('participantes')
                    .select('*')
                    .order('fecha_registro', { ascending: false }); 

                if (error) throw error;

                listaParticipantes = data || [];
                actualizarTabla(listaParticipantes);
                
                document.getElementById('cargando-texto').style.display = 'none';
                document.getElementById('tabla-participantes').style.display = 'table';
                document.getElementById('contador').innerText = `Participantes: ${listaParticipantes.length}`;

            } catch (err) {
                document.getElementById('cargando-texto').innerText = "Error al cargar datos: " + err.message;
                console.error(err);
            }
        }

        // Renderizar o pintar los datos en la tabla HTML
        function actualizarTabla(datos) {
            const cuerpoTabla = document.getElementById('cuerpo-tabla');
            cuerpoTabla.innerHTML = ''; 

            if (datos.length === 0) {
                cuerpoTabla.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#777;">No se encontraron registros.</td></tr>`;
                return;
            }

            datos.forEach(p => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td style="font-weight:600;">${p.nombre}</td>
                    <td>${p.cedula || 'N/P'}</td>
                    <td><a href="https://wa.me/${p.telefono ? p.telefono.replace(/[^0-9]/g, '') : ''}" target="_blank" style="color:#25D366; font-weight:600; text-decoration:none;">📱 ${p.telefono || 'N/P'}</a></td>
                    <td>${p.ciudad || 'N/P'}</td>
                    <td>${p.correo || 'N/P'}</td>
                    <td><span class="badge-qr">${p.token_qr_usado || 'N/P'}</span></td>
                    <td><span class="badge-estado">${p.estado_sorteo || 'Pendiente'}</span></td>
                `;
                cuerpoTabla.appendChild(fila);
            });
        }

        // Buscador interactivo en tiempo real
        document.getElementById('buscador').addEventListener('input', (e) => {
            const busqueda = e.target.value.toLowerCase().trim();
            const filtrados = listaParticipantes.filter(p => 
                p.nombre.toLowerCase().includes(busqueda) || 
                (p.cedula && p.cedula.toLowerCase().includes(busqueda))
            );
            actualizarTabla(filtrados);
        });

        // 🎁 LOGICA MÁGICA DEL SORTEO (EFECTO RULETA / TÓMBOLA)
        document.getElementById('btn-sorteo').addEventListener('click', () => {
            if (listaParticipantes.length === 0) {
                alert("No hay participantes registrados para realizar el sorteo.");
                return;
            }

            const modal = document.getElementById('modal-ganador');
            const animacionNombre = document.getElementById('animacion-nombre');
            const datosGanadorDiv = document.getElementById('datos-ganador');
            const btnCerrar = document.getElementById('btn-cerrar-modal');

            modal.style.display = 'flex';
            datosGanadorDiv.style.display = 'none';
            btnCerrar.style.display = 'none';

            let cambios = 0;
            const intervaloTiempo = 80; 
            const duracionTotal = 3000; 
            const maxCambios = duracionTotal / intervaloTiempo;

            const iteracion = setInterval(() => {
                const indiceAleatorio = Math.floor(Math.random() * listaParticipantes.length);
                animacionNombre.innerText = listaParticipantes[indiceAleatorio].nombre;
                cambios++;

                if (cambios >= maxCambios) {
                    clearInterval(iteracion); 
                    
                    const ganadorFinal = listaParticipantes[Math.floor(Math.random() * listaParticipantes.length)];
                    animacionNombre.innerText = ganadorFinal.nombre;
                    
                    datosGanadorDiv.innerHTML = `
                        <strong>🪪 Documento:</strong> ${ganadorFinal.cedula}<br>
                        <strong>📞 Teléfono:</strong> ${ganadorFinal.telefono}<br>
                        <strong>📍 Ciudad:</strong> ${ganadorFinal.ciudad}<br>
                        <strong>✉️ Correo:</strong> ${ganadorFinal.correo}<br>
                        <strong>🎫 Ticket QR:</strong> ${ganadorFinal.token_qr_usado}<br>
                        <strong>📊 Estado:</strong> ${ganadorFinal.estado_sorteo || 'Pendiente'}
                    `;
                    
                    datosGanadorDiv.style.display = 'block';
                    btnCerrar.style.display = 'inline-block';

                    lanzarConfeti();
                }
            }, intervaloTiempo);
        });

        function lanzarConfeti() {
            var duracion = 2 * 1000;
            var fin = Date.now() + duracion;

            (function frame() {
                confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff9800', '#d32f2f', '#ffffff'] });
                confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff9800', '#d32f2f', '#ffffff'] });

                if (Date.now() < fin) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        document.getElementById('btn-cerrar-modal').addEventListener('click', () => {
            document.getElementById('modal-ganador').style.display = 'none';
        });

        window.onload = cargarParticipantes;
    </script>
</body>
</html>
