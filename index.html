<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo - Industrias Pollo Premium 5.8, C.A.</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f7f9fa; color: #333; display: flex; justify-content: center; padding: 20px 10px; }
        .contenedor-movil { width: 100%; max-width: 450px; background: #ffffff; border-radius: 15px; box-shadow: 0px 4px 15px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e1e8ed; }
        .header { text-align: center; padding: 20px; background-color: #ffffff; border-bottom: 2px solid #f0f3f5; }
        .logo-simulado { font-weight: 800; font-size: 1.3rem; color: #d32f2f; text-transform: uppercase; }
        .logo-sub { font-size: 0.8rem; color: #777; display: block; }
        .banner { background: linear-gradient(135deg, #ff9800, #d32f2f); color: #ffffff; padding: 30px 20px; text-align: center; }
        .banner h1 { font-size: 1.6rem; margin-bottom: 10px; }
        form { padding: 25px 20px; }
        .grupo-campo { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background-color: #f8fafc; }
        input:focus, select:focus { outline: none; border-color: #ff9800; background-color: #ffffff; }
        .campo-qr { background-color: #edf2f7; font-weight: bold; color: #2d3748; }
        .grupo-mixto { display: flex; gap: 10px; }
        .grupo-mixto select { width: 35%; }
        .grupo-mixto input { width: 65%; }
        .boton-enviar { width: 100%; background: #d32f2f; color: white; border: none; padding: 15px; font-size: 1.1rem; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .boton-enviar:disabled { background: #cbd5e1; cursor: not-allowed; }
        .footer { text-align: center; padding: 20px; font-size: 0.75rem; color: #94a3b8; background-color: #f8fafc; border-top: 1px solid #e2e8f0; }
        .texto-ayuda { font-size: 0.75rem; color: #64748b; margin-top: 4px; display: block; }
        
        .alerta { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 0.9rem; font-weight: 600; }
        .alerta-exito { background-color: #e6fffa; color: #00695c; border: 1px solid #b2dfdb; }
        .alerta-error { background-color: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    </style>
</head>
<body>

    <div class="contenedor-movil">
        <div class="header">
            <div class="logo-simulado">Pollo Premium</div>
            <span class="logo-sub">Industrias Pollo Premium 5.8, C.A.</span>
        </div>

        <div class="banner">
            <h1>¡Gana 1 de los 10 Pollos Semanales! 🍗</h1>
            <p>Registra tus datos y participa en el gran sorteo.</p>
        </div>

        <div style="padding: 20px 20px 0 20px;">
            <div id="alerta-error" class="alerta alerta-error"></div>
            <div id="alerta-exito" class="alerta alerta-exito"></div>
        </div>

        <form id="formulario-promo">
            <div class="grupo-campo">
                <label for="codigo">Código QR</label>
                <input type="text" id="codigo" class="campo-qr" value="" readonly required>
            </div>

            <div class="grupo-campo">
                <label for="nombre">Nombre y Apellido / Razón Social</label>
                <input type="text" id="nombre" placeholder="Ej: John Doe o Inversiones 58 C.A." required>
            </div>

            <div class="grupo-campo">
                <label for="documento_numero">Cedula o RIF</label>
                <div class="grupo-mixto">
                    <select id="documento_tipo" required>
                        <option value="V" selected>V</option>
                        <option value="E">E</option>
                        <option value="J">J</option>
                    </select>
                    <input type="text" id="documento_numero" placeholder="Ej: 12345678" pattern="[0-9]{9}" inputmode="numeric" maxlength="9" required>
                </div>
                <span id="ayuda-doc" class="texto-ayuda">Cédula: Introduzca exactamente 8 dígitos numéricos.</span>
            </div>

            <div class="grupo-campo">
                <label for="telefono_numero">Teléfono Celular</label>
                <div class="grupo-mixto">
                    <select id="telefono_operadora" required>
                        <option value="0412" selected>0412</option>
                        <option value="0422">0422</option>
                        <option value="0414">0414</option>
                        <option value="0424">0424</option>
                        <option value="0416">0416</option>
                        <option value="0426">0426</option>
                    </select>
                    <input type="tel" id="telefono_numero" placeholder="1234567" pattern="[0-9]{7}" inputmode="numeric" maxlength="7" required>
                </div>
                <span class="texto-ayuda">Introduzca exactamente los 7 dígitos de su número.</span>
            </div>

            <div class="grupo-campo">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Ej: johnDoe@email.com" required>
            </div>

            <div class="grupo-campo">
                <label for="ciudad">Ciudad de Residencia</label>
                <select id="ciudad" required>
                    <option value="" disabled selected>Selecciona tu ciudad...</option>
                    <option value="Caracas">Caracas</option>
                    <option value="Los Teques">Los Teques</option>
                    <option value="La Guaira">La Guaira</option>
                    <option value="Maracay">Maracay</option>
                </select>
            </div>

            <button type="submit" id="btn-registrar" class="boton-enviar">¡REGISTRARME EN LA PROMO! 🤞</button>
        </form>

        <div class="footer">
            Industrias Pollo Premium 5.8, C.A. © 2026
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lkqixjlbbibnlufgldaw.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrcWl4amxiYmlibmx1ZmdsZGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjIzOTYsImV4cCI6MjA5NTYzODM5Nn0.mhZ1gGWozhSETPINmS0cyUCrDV4LcmUMPzDTDWq6bcI"; 

        emailjs.init({ publicKey: "MB9bTpr-0mvKHJKI_" });

        const WHATSAPP_EMPRESA = "584143329200"; 

        // Dynamic placeholder helper para Documentos
        const tipoDocSelect = document.getElementById('documento_tipo');
        const numDocInput = document.getElementById('documento_numero');
        const ayudaDocText = document.getElementById('ayuda-doc');

        tipoDocSelect.addEventListener('change', () => {
            if (tipoDocSelect.value === 'J') {
                numDocInput.placeholder = "Ej: 123456789";
                ayudaDocText.innerText = "RIF: Introduzca exactamente 9 dígitos numéricos.";
            } else {
                numDocInput.placeholder = "Ej: 12345678";
                ayudaDocText.innerText = "Cédula: Introduzca exactamente 8 dígitos numéricos.";
            }
        });

        // 🌟 Filtro estricto: Solo permitir números en el campo de cédula y teléfono mientras escriben
        [numDocInput, document.getElementById('telefono_numero')].forEach(input => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            const parametrosUrl = new URLSearchParams(window.location.search);
            const codigoDetectado = parametrosUrl.get('codigo');
            if (codigoDetectado) {
                document.getElementById('codigo').value = codigoDetectado.trim();
            }
        });

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('formulario-promo').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const boton = document.getElementById('btn-registrar');
            boton.disabled = true;
            boton.innerText = "Procesando registro...";

            document.getElementById('alerta-error').style.display = 'none';
            document.getElementById('alerta-exito').style.display = 'none';

            const codigo = document.getElementById('codigo').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const ciudad = document.getElementById('ciudad').value;

            // ⚡ PROCESAMIENTO Y VALIDACIÓN DEL DOCUMENTO
            const tipoDoc = tipoDocSelect.value;
            const numeroDocLimpio = numDocInput.value.replace(/[^0-9]/g, ''); 
            let cedulaFinal = `${tipoDoc}-${numeroDocLimpio}`; 

            // 📱 PROCESAMIENTO Y VALIDACIÓN DEL TELÉFONO
            const operadora = document.getElementById('telefono_operadora').value;
            const numTelefonoLimpio = document.getElementById('telefono_numero').value.replace(/[^0-9]/g, '');
            let telefonoFinal = `${operadora}-${numTelefonoLimpio}`; // Formato final: 0412-1234567

            try {
                // Validación estricta Documento
                if (tipoDoc === 'V' || tipoDoc === 'E') {
                    if (numeroDocLimpio.length !== 8) {
                        throw new Error("La cédula de identidad debe tener exactamente 8 números enteros.");
                    }
                } else if (tipoDoc === 'J') {
                    if (numeroDocLimpio.length !== 9) {
                        throw new Error("El RIF comercial debe tener exactamente 9 números enteros.");
                    }
                }

                // Validación estricta Teléfono
                if (numTelefonoLimpio.length !== 7) {
                    throw new Error("El número de teléfono debe tener exactamente 7 dígitos.");
                }

                if (!codigo) {
                    throw new Error("Error: No se ha detectado ningún código QR válido.");
                }

                // PASO 1: Verificar el estado del código QR en Supabase
                const { data: qrData, error: qrError } = await _supabase
                    .from('codigos_qr')
                    .select('*')
                    .eq('token_qr', codigo)
                    .maybeSingle();

                if (qrError || !qrData) throw new Error("El código introducido no es válido.");
                if (qrData.estado === 'Usado') throw new Error("¡Este código QR ya fue utilizado!");

                // PASO 2: Insertar participante en Supabase
                const { error: insertError } = await _supabase
                    .from('participantes')
                    .insert([{ nombre, cedula: cedulaFinal, telefono: telefonoFinal, correo, ciudad, token_qr_usado: codigo }]);

                if (insertError) throw new Error("No se pudieron guardar tus datos.");

                // PASO 3: Envío del correo vía EmailJS 
                try {
                    await emailjs.send("service_7i0v0tc", "template_gd939sf", {
                        nombre, correo, codigo, cedula: cedulaFinal, telefono: telefonoFinal, ciudad
                    });
                } catch (errorEmail) {
                    console.error("Error en EmailJS:", errorEmail);
                }

                // PASO 4: "Quemar" el código cambiándolo a 'Usado'
                await _supabase.from('codigos_qr').update({ estado: 'Usado' }).eq('token_qr', codigo);

                // MUESTRA DE ÉXITO VISUAL
                document.getElementById('alerta-exito').innerText = `¡Registro Exitoso, ${nombre}! Mucha suerte en el sorteo. Recuerda seguirnos en nuestras redes sociales y enviarnos un mensaje a nuestro WhatsApp.`;
                document.getElementById('alerta-exito').style.display = 'block';
                document.getElementById('formulario-promo').reset(); 

                // PASO 5: Redirección Mágica a WhatsApp
                const textoMensaje = `¡Hola *Industrias Pollo Premium 5.8*! 👋 Acabo de registrarme con éxito en el sorteo semanal. 🍗\n\n*Mis Datos:*\n• Nombre: ${nombre}\n• Documento: *${cedulaFinal}*\n• Teléfono: *${telefonoFinal}*\n• Código QR: *${codigo}*`;
                const urlWhatsapp = `https://api.whatsapp.com/send?phone=${WHATSAPP_EMPRESA}&text=${encodeURIComponent(textoMensaje)}`;
                
                setTimeout(() => {
                    window.location.href = urlWhatsapp;
                }, 2000);

            } catch (err) {
                document.getElementById('alerta-error').innerText = err.message;
                document.getElementById('alerta-error').style.display = 'block';
            } finally {
                boton.disabled = false;
                boton.innerText = "¡REGISTRARME EN LA PROMO! 🤞";
            }
        });
    </script>
</body>
</html>
